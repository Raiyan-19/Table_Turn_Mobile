name: table_turn
description: "Table Turn - Dining Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
